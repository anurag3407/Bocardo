# Bocardo single-VPS production stack
# Stack: Caddy (TLS) -> api (x2) + admin -> postgres(PostGIS) + redis
name: bocardo

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - admin
    networks: [edge]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://bocardo:${POSTGRES_PASSWORD}@postgres:5432/bocardo
      DIRECT_URL: postgresql://bocardo:${POSTGRES_PASSWORD}@postgres:5432/bocardo
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits: { cpus: '1.0', memory: 768M }
    networks: [edge, internal]

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://52.66.138.38}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://52.66.138.38}
    restart: unless-stopped
    env_file: .env.production
    networks: [edge]

  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bocardo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bocardo
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./packages/database/src/migrations:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: >
      postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bocardo -d bocardo"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: { memory: 1536M }
    networks: [internal]

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  pg-backup:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    volumes:
      - ./infra/scripts/backup.sh:/backup.sh:ro
      - pg_backups:/backups
    environment:
      PGHOST: postgres
      PGUSER: bocardo
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: bocardo
    entrypoint: ["/bin/sh", "-c", "while true; do /backup.sh; sleep 86400; done"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

networks:
  edge:
  internal:
    internal: true

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
  pg_backups:
