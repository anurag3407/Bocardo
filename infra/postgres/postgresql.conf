# Bocardo Postgres 16 tuning — target VPS: 4 vCPU / 8 GB RAM (shared with app tier)
# Adjust shared_buffers upward if DB gets a dedicated VM.

listen_addresses = '*'
max_connections = 200

# Memory (25% RAM rule of thumb for shared_buffers on a dedicated node;
# here conservative because the VPS also runs the app tier)
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB

# WAL + durability (safe defaults; async commits NOT enabled)
wal_level = replica
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9

# Query planner (SSD on GCP)
random_page_cost = 1.1
effective_io_concurrency = 200

# Parallelism
max_worker_processes = 4
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# Logging for slow-query audits
log_min_duration_statement = 500
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0

# Stats for pg_stat_statements (enable extension post-install)
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all

# Timezone for IST business reports
log_timezone = 'Asia/Kolkata'
timezone = 'Asia/Kolkata'
